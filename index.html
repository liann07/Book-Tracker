<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Book Tracker">
<meta name="application-name" content="Book Tracker">
<meta name="theme-color" content="#1F4D3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EBE3;--surface:#F7F9F4;--ink:#1D2922;--mute:#5C6B61;--line:#C9D3C6;--forest:#1F4D3A;--on-forest:#F3F6EF;--brass:#A87B2A;--wine:#7A2E3B;--shelf:#8A6A44;--shadow:rgba(29,41,34,.18);
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101815;--surface:#1A2520;--ink:#E7EDE3;--mute:#93A398;--line:#2C3B33;--forest:#6FBF98;--on-forest:#10241B;--brass:#D9A84E;--wine:#D98B9A;--shelf:#5E4A31;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#101815;--surface:#1A2520;--ink:#E7EDE3;--mute:#93A398;--line:#2C3B33;--forest:#6FBF98;--on-forest:#10241B;--brass:#D9A84E;--wine:#D98B9A;--shelf:#5E4A31;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-wrap:break-word}
img,svg,video,canvas,picture{max-width:100%;height:auto}
iframe,embed,object{max-width:100%}
header>div{min-width:0}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 120px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:700 clamp(32px,9vw,46px)/1.05 var(--serif);margin:6px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0;font-family:var(--serif);font-style:italic}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:50%;width:44px;height:44px;flex:0 0 auto;font-size:18px;cursor:pointer}
.stats{display:flex;gap:8px;margin:18px 0 6px;overflow-x:auto;padding-bottom:4px}
.stat{flex:1 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:92px}
.stat b{display:block;font:700 24px/1.1 var(--serif);color:var(--forest)}.stat span{font-size:13px;color:var(--mute)}
.shelf{margin:22px -18px 0;padding:0 18px;position:relative}
.books{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;min-height:170px;padding:10px 4px 0;scrollbar-width:none}
.books::-webkit-scrollbar{display:none}
.spine{flex:0 0 auto;width:34px;border:0;border-radius:3px 3px 1px 1px;color:#F6EFE0;cursor:pointer;position:relative;padding:12px 0 10px;box-shadow:inset -4px 0 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.12),2px 0 4px var(--shadow);font:500 13px/1 var(--serif);writing-mode:vertical-rl;text-orientation:mixed;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:3px;background:rgba(246,239,224,.55)}
.spine::before{top:8px}.spine::after{bottom:8px}
.spine.reading{outline:2px solid var(--brass);outline-offset:1px}
.board{height:14px;background:var(--shelf);border-radius:2px;box-shadow:0 6px 10px var(--shadow)}
.tools{display:flex;gap:8px;margin:26px 0 12px;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--forest);outline-offset:2px}
.search{flex:1 1 100%}
.chips{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}
.card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.mini{flex:0 0 46px;height:68px;border-radius:3px 6px 6px 3px;box-shadow:inset -5px 0 0 rgba(0,0,0,.2),2px 2px 5px var(--shadow)}
.card>div:last-child{min-width:0}
.card h3{font:700 19px/1.2 var(--serif);margin:0}.card p{margin:2px 0 6px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.tag{padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.st{border-color:transparent;color:#fff;background:var(--forest)}
.st.s-Want{background:var(--brass)}.st.s-Paused{background:#5E6E8A}.st.s-Dropped{background:var(--wine)}.st.s-Reading{background:var(--forest)}
@media (prefers-color-scheme:dark){.st{color:#10241B}}
.empty{text-align:center;padding:36px 10px;color:var(--mute);font-family:var(--serif);font-style:italic;font-size:18px}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--forest);color:var(--on-forest);border:0;border-radius:999px;padding:15px 22px;font:700 16px var(--sans);box-shadow:0 8px 20px var(--shadow);cursor:pointer}
dialog{border:0;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);width:min(560px,100%);max-width:100%;margin:auto auto 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;max-height:92dvh;overflow-y:auto}
@media(min-width:620px){dialog{border-radius:22px;margin:auto}}
dialog::backdrop{background:rgba(10,18,14,.55)}
dialog h2{font:700 26px var(--serif);margin:0 0 14px}
label{display:block;font-size:14px;font-weight:500;color:var(--mute);margin:0 0 12px}
label input,label select{margin-top:4px;color:var(--ink)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{flex:1;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:13px;font:700 16px var(--sans);cursor:pointer}
.btn.main{background:var(--forest);color:var(--on-forest);border-color:var(--forest)}.btn.del{color:var(--wine);flex:0 0 auto}
@media (max-width:619px){
.stat span,.tags,.chip,label{font-size:16px}
.chip{min-height:44px;padding:9px 16px}
.spine{min-width:44px}
.btn{min-height:48px}
.fab{min-height:48px}
}
@media (max-width:359px){.acts .btn{flex:1 1 40%}.acts .btn.main{flex-basis:100%}}
@media(prefers-reduced-motion:no-preference){.spine:active,.card:active{transform:scale(.98)}}
.confirm{max-width:420px;text-align:center;border-radius:22px;margin:auto;padding:26px 22px}
.confirm h2{font-size:22px}
.confirm p{margin:0 0 18px;color:var(--mute);font-family:var(--serif);font-style:italic}
.btn.danger{background:var(--wine);border-color:var(--wine);color:var(--on-forest)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Book Tracker</h1>
      <p class="sub">Every book you’ve loved, lent, or left half-read.</p>
    </div>
    <button class="iconbtn" id="theme" aria-label="Switch light or dark theme">◐</button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="shelf"><div class="books" id="books" aria-label="Your bookshelf"></div><div class="board"></div></div>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Search title, author or genre" aria-label="Search books">
    <div class="chips" id="chips"></div>
  </div>
  <div id="list"></div>
</div>
<button class="fab" id="add">+ Add a book</button>

<dialog id="dlg">
  <h2 id="dtitle">Add a book</h2>
  <div>
    <label>Title<input id="f-title" required autocomplete="off"></label>
    <label>Author<input id="f-author" autocomplete="off"></label>
    <div class="row">
      <label>Main genre<input id="f-main" list="mains" autocomplete="off"></label>
      <label>Sub genre<input id="f-sub" autocomplete="off"></label>
    </div>
    <div class="row">
      <label>Source<select id="f-source"></select></label>
      <label>Status<select id="f-status"></select></label>
    </div>
    <datalist id="mains"></datalist>
    <div class="acts">
      <button class="btn del" id="del" type="button">Delete</button>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn main" id="save" type="button">Save book</button>
    </div>
  </div>
</dialog>
<dialog id="confirmDlg" class="confirm">
  <h2>Would you like to remove this book?</h2>
  <p id="confirmText"></p>
  <div class="acts">
    <button class="btn" id="confirmNo" type="button">No</button>
    <button class="btn main danger" id="confirmYes" type="button">Yes</button>
  </div>
</dialog>
<script>
const SOURCES=['Library','Bought','Borrowed','Gift','E-book','Audiobook','Other'];
const STATUSES=['Want to read','Reading','Finished','Paused','Dropped'];
const GENRES=['Fiction','Non-fiction','Fantasy','Science fiction','Mystery','Romance','Historical','Biography','Poetry','Self-help'];
const COLORS=['#7A2E3B','#1F4D3A','#2D3F6B','#8A5A22','#4A2F5E','#1F5B66','#5B3A29','#6B2F4C'];
const KEY='track-your-books:v1';
let books=[],filter='All',editing=null;
try{books=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){books=[]}
if(!Array.isArray(books))books=[];
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){}};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const color=b=>COLORS[hash(b.main||b.title)%COLORS.length];
const height=b=>110+hash(b.title)%60;
function opts(el,arr){el.innerHTML=arr.map(a=>`<option>${a}</option>`).join('')}
opts($('f-source'),SOURCES);opts($('f-status'),STATUSES);
$('mains').innerHTML=GENRES.map(g=>`<option value="${g}">`).join('');
function render(){
  const n=s=>books.filter(b=>b.status===s).length;
  $('stats').innerHTML=`<div class="stat"><b>${books.length}</b><span>On the shelf</span></div><div class="stat"><b>${n('Reading')}</b><span>Reading now</span></div><div class="stat"><b>${n('Finished')}</b><span>Finished</span></div><div class="stat"><b>${n('Want to read')}</b><span>Waiting</span></div>`;
  $('books').innerHTML=books.length?books.map(b=>`<button class="spine ${b.status==='Reading'?'reading':''}" style="background:${color(b)};height:${height(b)}px" data-id="${b.id}" aria-label="${esc(b.title)}">${esc(b.title)}</button>`).join(''):'';
  $('chips').innerHTML=['All',...STATUSES].map(s=>`<button class="chip" aria-pressed="${s===filter}" data-f="${s}">${s}</button>`).join('');
  const q=$('q').value.trim().toLowerCase();
  const rows=books.filter(b=>(filter==='All'||b.status===filter)&&(!q||[b.title,b.author,b.main,b.sub].join(' ').toLowerCase().includes(q)));
  $('list').innerHTML=rows.length?rows.map(b=>`<button class="card" data-id="${b.id}"><div class="mini" style="background:${color(b)}"></div><div><h3>${esc(b.title)}</h3><p>${esc(b.author)||'Unknown author'}</p><div class="tags"><span class="tag st s-${b.status.split(' ')[0]}">${b.status}</span>${b.main?`<span class="tag">${esc(b.main)}</span>`:''}${b.sub?`<span class="tag">${esc(b.sub)}</span>`:''}<span class="tag">${b.source}</span></div></div></button>`).join(''):`<div class="empty">${books.length?'No books match that search.':'Your shelf is empty. Add the first book you’ve read or want to read.'}</div>`;
}
function openForm(id){
  editing=id?books.find(b=>b.id===id):null;
  const b=editing||{title:'',author:'',main:'',sub:'',source:'Library',status:'Want to read'};
  $('dtitle').textContent=editing?'Edit book':'Add a book';
  $('f-title').value=b.title;$('f-author').value=b.author;$('f-main').value=b.main;$('f-sub').value=b.sub;$('f-source').value=b.source;$('f-status').value=b.status;
  $('del').style.display=editing?'':'none';
  $('dlg').showModal();
}
$('add').onclick=()=>openForm();
$('cancel').onclick=()=>$('dlg').close();
$('save').onclick=()=>{
  const title=$('f-title').value.trim();
  if(!title){$('f-title').focus();return}
  const d={title,author:$('f-author').value.trim(),main:$('f-main').value.trim(),sub:$('f-sub').value.trim(),source:$('f-source').value,status:$('f-status').value};
  if(editing)Object.assign(editing,d);else books.unshift({id:Date.now().toString(36),...d});
  save();render();$('dlg').close();
};
$('del').onclick=()=>{
  if(!editing)return;
  $('confirmText').textContent='“'+editing.title+'”';
  $('confirmDlg').showModal();
};
$('confirmNo').onclick=()=>$('confirmDlg').close();
$('confirmYes').onclick=()=>{
  books=books.filter(b=>b!==editing);
  save();render();
  $('confirmDlg').close();
  $('dlg').close();
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-id]');if(t){openForm(t.dataset.id);return}
  const c=e.target.closest('[data-f]');if(c){filter=c.dataset.f;render()}
});
$('q').oninput=render;
$('theme').onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';
};
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
